<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300;400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="masthead__name">{{ profile.name if profile else "Portfolio" }}</p>
    {% if profile and profile.location %}<p class="masthead__meta">{{ profile.location }}</p>{% endif %}
  </header>

  {% block content %}{% endblock %}

  {% if profile and profile.email %}
  <footer class="footer">
    <p><a href="mailto:{{ profile.email }}">{{ profile.email }}</a></p>
  </footer>
  {% endif %}
</div>
</body>
</html>
